<!doctype html><html><head><meta charset="utf-8"><title>Daily Ledger Digital</title>
<style>
body{margin:0;background:#14161b;color:#eceff4;font-family:'Carlito',sans-serif;font-size:15px}
.wrap{max-width:860px;margin:0 auto;padding:18px 24px;text-align:center}
.card{background:#1f232b;border-radius:0px;padding:18px 20px;margin:14px 0;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{background:#1d10a7;color:#fff;border:0;padding:11px 20px;border-radius:0px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn2{background:transparent;color:#eceff4;border:1px solid #a7b0bf;padding:10px 18px;border-radius:0px;font-size:15px;cursor:pointer;font-family:inherit}
.muted{color:#a7b0bf}
.row{display:flex;justify-content:space-between;margin:6px 0}
</style></head><body>
<header style="border-bottom:3px solid #1d10a7;padding:14px 24px;font-weight:700;font-size:22px">GangaBazaar</header>
<div class="wrap"><div class="card"><h1 id="title" style="margin:0 0 6px">Daily Ledger Digital</h1>
<div id="price" style="font-size:24px;font-weight:700">₹149 / month</div>
<p class="muted">Unlimited access. Cancel any time.</p>
<div style="margin-top:14px"><button id="accept" class="btn">Start 7-day free trial</button> <button id="decline" class="btn2">Maybe later</button></div></div><div class="card" style="border-left:4px solid #1d10a7" data-gt="FU"><b>Festive deal ends in <span id="timer">--:--:--</span></b>
<div class="muted">Only 3 left at this price</div></div></div>
<script>var __end=Date.now()+58716*1000;function __tick(){var r=Math.max(0,Math.floor((__end-Date.now())/1000))%(24*3600);
var h=Math.floor(r/3600),m=Math.floor(r%3600/60),s=r%60;
document.getElementById('timer').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
__tick();setInterval(__tick,250);</script></body></html>
