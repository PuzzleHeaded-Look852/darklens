<!doctype html><html><head><meta charset="utf-8"><title>Cart</title>
<style>
body{margin:0;background:#14161b;color:#eceff4;font-family:'Bitstream Charter',sans-serif;font-size:16px}
.wrap{max-width:860px;margin:0 auto;padding:18px 24px;text-align:center}
.card{background:#1f232b;border-radius:8px;padding:18px 20px;margin:14px 0;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{background:#882f20;color:#fff;border:0;padding:11px 20px;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.btn2{background:transparent;color:#eceff4;border:1px solid #a7b0bf;padding:10px 18px;border-radius:8px;font-size:16px;cursor:pointer;font-family:inherit}
.muted{color:#a7b0bf}
.row{display:flex;justify-content:space-between;margin:6px 0}
</style></head><body>
<header style="border-bottom:3px solid #882f20;padding:14px 24px;font-weight:700;font-size:22px">BodhiDirect</header>
<div class="wrap"><h2>Your cart</h2><div class="card"><div class="row"><span class="item">Nimbus Phone &ndash; 128GB</span><span>₹32,699</span></div>
<div class="row"><b>Subtotal</b><b class="total">₹32,699</b></div><button id="proceed" class="btn">Proceed</button></div><div class="card"><b>Sign in for a faster checkout</b><div class="muted">Use your BodhiDirect account to track orders.</div>
<div style="margin-top:10px"><button class="btn">Sign in / Create account</button> <button id="guest" class="btn2" disabled aria-disabled="true" data-gt="FA" style="opacity:.35;pointer-events:none">Continue as guest</button></div></div></div><div id="overlay" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50"></div>
<div id="popup" role="dialog" style="position:fixed;z-index:60;left:50%;top:180px;transform:translateX(-50%);width:420px;background:#1f232b;color:#eceff4;padding:22px;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.35)">
<h3 style="margin:0 0 8px">Get 10% off your first order</h3>
<p style="margin:0 0 14px;color:#a7b0bf">Join the BodhiDirect newsletter for weekly offers.</p>
<input placeholder="Email address" style="width:95%;padding:8px;margin-bottom:12px">
<button style="background:#882f20;color:#fff;border:0;padding:9px 16px;border-radius:8px">Subscribe</button>
<button id="popup-close" style="background:transparent;color:#eceff4;border:1px solid #a7b0bf;padding:8px 14px;margin-left:8px;border-radius:8px">Close</button>
</div>
<script></script></body></html>
