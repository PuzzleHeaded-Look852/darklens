<!doctype html><html><head><meta charset="utf-8"><title>Cart</title>
<style>
body{margin:0;background:#f9f9fb;color:#111111;font-family:'DejaVu Serif',sans-serif;font-size:14px}
.wrap{max-width:760px;margin:0 auto;padding:18px 24px;text-align:center}
.card{background:#ffffff;border-radius:14px;padding:18px 20px;margin:14px 0;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{background:#244c81;color:#fff;border:0;padding:11px 20px;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn2{background:transparent;color:#111111;border:1px solid #5b6472;padding:10px 18px;border-radius:14px;font-size:14px;cursor:pointer;font-family:inherit}
.muted{color:#5b6472}
.row{display:flex;justify-content:space-between;margin:6px 0}
</style></head><body>
<header style="background:#244c81;color:#fff;padding:14px 24px;font-weight:700;font-size:22px">SaffronHub</header>
<div class="wrap"><h2>Your cart</h2><div class="card"><div class="row"><span class="item">Vista Monitor &ndash; 27-inch 4K</span><span>₹2,599</span></div>
<div class="row"><b>Subtotal</b><b class="total">₹2,599</b></div><button id="proceed" class="btn">Proceed</button></div><div class="card"><b>Sign in for a faster checkout</b><div class="muted">Use your SaffronHub account to track orders.</div>
<div style="margin-top:10px"><button class="btn">Sign in / Create account</button> <button id="guest" class="btn2">Continue as guest</button></div></div></div><div id="overlay" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50"></div>
<div id="popup" role="dialog" style="position:fixed;z-index:60;left:50%;top:180px;transform:translateX(-50%);width:420px;background:#ffffff;color:#111111;padding:22px;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.35)">
<h3 style="margin:0 0 8px">Get 10% off your first order</h3>
<p style="margin:0 0 14px;color:#5b6472">Join the SaffronHub newsletter for weekly offers.</p>
<input placeholder="Email address" style="width:95%;padding:8px;margin-bottom:12px">
<button style="background:#244c81;color:#fff;border:0;padding:9px 16px;border-radius:14px">Subscribe</button>
<button id="popup-close" style="background:transparent;color:#111111;border:1px solid #5b6472;padding:8px 14px;margin-left:8px;border-radius:14px">Close</button>
</div>
<script></script></body></html>
