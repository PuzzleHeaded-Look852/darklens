<!doctype html><html><head><meta charset="utf-8"><title>Add-ons</title>
<style>
body{margin:0;background:#f3f9f9;color:#20242c;font-family:'FreeSans',sans-serif;font-size:16px}
.wrap{max-width:860px;margin:0 auto;padding:18px 24px;text-align:left}
.card{background:#ffffff;border-radius:8px;padding:18px 20px;margin:14px 0;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{background:#18b5b3;color:#fff;border:0;padding:11px 20px;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.btn2{background:transparent;color:#20242c;border:1px solid #5b6472;padding:10px 18px;border-radius:8px;font-size:16px;cursor:pointer;font-family:inherit}
.muted{color:#5b6472}
.row{display:flex;justify-content:space-between;margin:6px 0}
</style></head><body>
<header style="padding:14px 24px;font-weight:700;font-size:22px">LotusDirect</header>
<div class="wrap"><h2>Protect your purchase</h2><div class="card"><label><input id="warranty" type="checkbox"> Add 1-year extended warranty (₹169)</label>
<p class="muted">Covers accidental damage and liquid spills.</p>
<div style="margin-top:14px"><button id="accept" class="btn">Add protection</button> <button id="decline" class="btn2">No thanks</button></div></div>
<div class="card"><label><input type="checkbox"> Send me offers and product updates by email</label></div></div><div id="overlay" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50"></div>
<div id="popup" role="dialog" style="position:fixed;z-index:60;left:50%;top:180px;transform:translateX(-50%);width:420px;background:#ffffff;color:#20242c;padding:22px;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.35)">
<h3 style="margin:0 0 8px">Get 10% off your first order</h3>
<p style="margin:0 0 14px;color:#5b6472">Join the LotusDirect newsletter for weekly offers.</p>
<input placeholder="Email address" style="width:95%;padding:8px;margin-bottom:12px">
<button style="background:#18b5b3;color:#fff;border:0;padding:9px 16px;border-radius:8px">Subscribe</button>
<button id="popup-close" style="background:transparent;color:#20242c;border:1px solid #5b6472;padding:8px 14px;margin-left:8px;border-radius:8px">Close</button>
</div>
<script></script></body></html>
