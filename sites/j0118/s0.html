<!doctype html><html><head><meta charset="utf-8"><title>Daily Ledger Digital</title>
<style>
body{margin:0;background:#fbfbfc;color:#20242c;font-family:'FreeSerif',sans-serif;font-size:14px}
.wrap{max-width:960px;margin:0 auto;padding:18px 24px;text-align:center}
.card{background:#ffffff;border-radius:14px;padding:18px 20px;margin:14px 0;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{background:#741eb8;color:#fff;border:0;padding:11px 20px;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn2{background:transparent;color:#20242c;border:1px solid #5b6472;padding:10px 18px;border-radius:14px;font-size:14px;cursor:pointer;font-family:inherit}
.muted{color:#5b6472}
.row{display:flex;justify-content:space-between;margin:6px 0}
</style></head><body>
<header style="background:#741eb8;color:#fff;padding:14px 24px;font-weight:700;font-size:22px">ZenHub</header>
<div class="wrap"><div class="card"><h1 id="title" style="margin:0 0 6px">Daily Ledger Digital</h1>
<div id="price" style="font-size:24px;font-weight:700">₹299 / month</div>
<p class="muted">Unlimited access. Cancel any time.</p>
<div style="margin-top:14px"><button id="decline" class="btn2">Maybe later</button> <button id="accept" class="btn">Start 7-day free trial</button></div></div><div class="card" style="border-left:4px solid #741eb8" data-gt="FU"><b>Festive deal ends in <span id="timer">--:--:--</span></b>
<div class="muted">Only 3 left at this price</div></div></div>
<script>var __end=Date.now()+35616*1000;function __tick(){var r=Math.max(0,Math.floor((__end-Date.now())/1000))%(24*3600);
var h=Math.floor(r/3600),m=Math.floor(r%3600/60),s=r%60;
document.getElementById('timer').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
__tick();setInterval(__tick,250);</script></body></html>
