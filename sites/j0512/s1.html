<!doctype html><html><head><meta charset="utf-8"><title>Cart</title>
<style>
body{margin:0;background:#14161b;color:#eceff4;font-family:'Bitstream Charter',sans-serif;font-size:15px}
.wrap{max-width:760px;margin:0 auto;padding:18px 24px;text-align:left}
.card{background:#1f232b;border-radius:24px;padding:18px 20px;margin:14px 0;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{background:#c49f0c;color:#fff;border:0;padding:11px 20px;border-radius:24px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn2{background:transparent;color:#eceff4;border:1px solid #a7b0bf;padding:10px 18px;border-radius:24px;font-size:15px;cursor:pointer;font-family:inherit}
.muted{color:#a7b0bf}
.row{display:flex;justify-content:space-between;margin:6px 0}
</style></head><body>
<header style="padding:14px 24px;font-weight:700;font-size:22px">TaraKart</header>
<div class="wrap"><h2>Your cart</h2><div class="card"><div class="row"><span class="item">Pulse Earbuds &ndash; ANC Pro</span><span>₹17,699</span></div>
<div class="row"><b>Subtotal</b><b class="total">₹17,699</b></div><button id="proceed" class="btn">Proceed</button></div></div><div id="overlay" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50"></div>
<div id="popup" role="dialog" style="position:fixed;z-index:60;left:50%;top:180px;transform:translateX(-50%);width:420px;background:#1f232b;color:#eceff4;padding:22px;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.35)">
<h3 style="margin:0 0 8px">Get 10% off your first order</h3>
<p style="margin:0 0 14px;color:#a7b0bf">Join the TaraKart newsletter for weekly offers.</p>
<input placeholder="Email address" style="width:95%;padding:8px;margin-bottom:12px">
<button style="background:#c49f0c;color:#fff;border:0;padding:9px 16px;border-radius:24px">Subscribe</button>
<button id="popup-close" style="background:transparent;color:#eceff4;border:1px solid #a7b0bf;padding:8px 14px;margin-left:8px;border-radius:24px">Close</button>
</div>
<script></script></body></html>
