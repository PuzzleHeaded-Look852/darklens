<!doctype html><html><head><meta charset="utf-8"><title>Aero Laptop</title>
<style>
body{margin:0;background:#f5f9f5;color:#20242c;font-family:'Libertinus Sans',sans-serif;font-size:15px}
.wrap{max-width:860px;margin:0 auto;padding:18px 24px;text-align:center}
.card{background:#ffffff;border-radius:4px;padding:18px 20px;margin:14px 0;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{background:#2ca426;color:#fff;border:0;padding:11px 20px;border-radius:4px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn2{background:transparent;color:#20242c;border:1px solid #5b6472;padding:10px 18px;border-radius:4px;font-size:15px;cursor:pointer;font-family:inherit}
.muted{color:#5b6472}
.row{display:flex;justify-content:space-between;margin:6px 0}
</style></head><body>
<header style="background:#2ca426;color:#fff;padding:14px 24px;font-weight:700;font-size:22px">LotusDeals</header>
<div class="wrap"><div class="card"><h1 id="title" style="margin:0 0 6px">Aero Laptop &ndash; 16GB RAM</h1>
<div id="price" style="font-size:26px;font-weight:700">₹33,399</div><div class="muted">+ ₹49 handling and ₹199 convenience fee, payable at checkout</div>
<p class="muted">Free delivery in 3&ndash;5 days. 7-day replacement.</p>
<button id="add" class="btn">Add to cart</button></div><div class="card" style="border-left:4px solid #2ca426" data-gt="FU"><b>Festive deal ends in <span id="timer">--:--:--</span></b>
<div class="muted">Only 2 left at this price</div></div></div>
<script>var __end=Date.now()+36375*1000;function __tick(){var r=Math.max(0,Math.floor((__end-Date.now())/1000))%(24*3600);
var h=Math.floor(r/3600),m=Math.floor(r%3600/60),s=r%60;
document.getElementById('timer').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
__tick();setInterval(__tick,250);</script></body></html>
