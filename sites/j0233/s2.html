<!doctype html><html><head><meta charset="utf-8"><title>Add-ons</title>
<style>
body{margin:0;background:#fcfcfc;color:#222222;font-family:'Caladea',sans-serif;font-size:14px}
.wrap{max-width:960px;margin:0 auto;padding:18px 24px;text-align:left}

.row{display:flex;justify-content:space-between;margin:6px 0}

<header style="padding:14px 24px;font-weight:700;font-size:22px">KiranBazaar</header>
